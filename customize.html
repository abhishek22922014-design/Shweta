<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#430e24">
  <title>Invitation Studio | Shweta & Abhishek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#430e24;--wine2:#7d2744;--gold:#d8ae62;--cream:#fff8ed;--ink:#46293a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 50% -20%,#7a324b,#330e20 55%,#1d0814);font-family:Jost,Arial,sans-serif}
    .shell{width:min(1100px,100%);margin:auto;padding:32px 18px 52px}
    .heading{text-align:center;margin-bottom:24px}
    .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
    h1{font:400 clamp(48px,8vw,76px)/1 'Great Vibes',cursive;color:#ffe2a6;margin:12px 0 8px}
    .heading p{margin:0;color:#e5cfd7;font-family:'Cormorant Garamond',serif;font-size:19px}
    .layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px;align-items:start}
    .panel,.preview{background:linear-gradient(160deg,#fffaf1,#f3dfbd);color:var(--ink);border:1px solid #e0bd79;border-radius:18px;box-shadow:0 25px 70px #09010888}
    .panel{padding:28px}
    label{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7d4a63;margin-bottom:8px}
    input{width:100%;padding:14px 15px;border:1px solid #cba969;border-radius:10px;background:#fffdf8;color:#361020;font:500 17px 'Cormorant Garamond',serif;outline:none}
    input:focus{border-color:#7d2744;box-shadow:0 0 0 3px #7d27441c}
    .hint{font-size:12px;line-height:1.5;color:#806673;margin:8px 0 20px}
    .actions{display:grid;gap:10px}
    button,a.button{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:9px;border:1px solid #d7ad62;text-decoration:none;font:600 13px Jost,sans-serif;cursor:pointer}
    .primary{background:linear-gradient(120deg,#9f6828,#e1bd72,#9c6222);color:#351225}
    .secondary{background:#64233c;color:#fff8ed}
    .light{background:#fffaf0;color:#62233b}
    .status{min-height:20px;margin-top:14px;text-align:center;font-size:12px;color:#6f5361}
    .preview{padding:10px;overflow:hidden}
    .preview-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 14px;font:600 11px Jost,sans-serif;letter-spacing:.12em;color:#765263;text-transform:uppercase}
    iframe{display:block;width:100%;height:720px;border:0;border-radius:11px;background:#330e20}
    @media(max-width:780px){.layout{grid-template-columns:1fr}.panel{padding:22px}.preview{padding:7px}iframe{height:680px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="heading">
      <div class="kicker">✦ Invitation Studio ✦</div>
      <h1>Shweta & Abhishek</h1>
      <p>Create and share a personalized engagement invitation.</p>
    </header>
    <section class="layout">
      <div class="panel">
        <label for="guestName">Guest or family name</label>
        <input id="guestName" maxlength="110" value="Mr. Rahul Kumar & Family" placeholder="e.g. Mr. Rahul Kumar & Family" autocomplete="name">
        <p class="hint">The guest name is added securely to the invitation link. No separate HTML file is required.</p>
        <div class="actions">
          <button class="primary" id="previewBtn">✦ Update Preview</button>
          <button class="secondary" id="copyBtn">⧉ Copy Personalized Link</button>
          <a class="button light" id="openBtn" href="index.html" target="_blank" rel="noopener">↗ Open Full Invitation</a>
          <button class="secondary" id="whatsappBtn">💬 Share via WhatsApp</button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div class="preview">
        <div class="preview-bar"><span>Live preview</span><span id="previewName"></span></div>
        <iframe id="previewFrame" title="Personalized invitation preview"></iframe>
      </div>
    </section>
  </main>
  <script>
    const guestInput=document.getElementById('guestName');
    const previewFrame=document.getElementById('previewFrame');
    const openBtn=document.getElementById('openBtn');
    const status=document.getElementById('status');
    function guestName(){return guestInput.value.trim().replace(/\s+/g,' ').slice(0,110)||'Our Honoured Guest'}
    function invitationUrl(){const url=new URL('index.html',location.href);url.searchParams.set('guest',guestName());return url.href}
    function updatePreview(){const name=guestName();previewFrame.src=invitationUrl();openBtn.href=invitationUrl();document.getElementById('previewName').textContent=name;status.textContent='Preview updated for '+name+'.'}
    async function copyLink(){const url=invitationUrl(true);try{await navigator.clipboard.writeText(url);status.textContent='Personalized link copied.'}catch{const area=document.createElement('textarea');area.value=url;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();status.textContent='Personalized link copied.'}}
    function shareWhatsApp(){const message='You are warmly invited to celebrate the engagement of Shweta Kumari & Abhishek Kumar. Open your personalized invitation: '+invitationUrl(true);window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')}
    document.getElementById('previewBtn').addEventListener('click',updatePreview);
    document.getElementById('copyBtn').addEventListener('click',copyLink);
    document.getElementById('whatsappBtn').addEventListener('click',shareWhatsApp);
    guestInput.addEventListener('keydown',event=>{if(event.key==='Enter')updatePreview()});
    updatePreview();
  </script>
</body>
</html>
